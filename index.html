    const back = document.createElement('button');
    back.className = 'day-detail-back';
    back.innerHTML = '←';
    back.addEventListener('click', () => { todaySelectedFolder = null; folderDashboardView = false; render(); });
    const title = document.createElement('div');
    title.className = 'day-detail-title folder-detail-title';
    title.textContent = folder ? folder.name : '';
    header.appendChild(back);
    header.appendChild(title);
    if (folder) {
      const gear = document.createElement('button');
      gear.className = 'icon-btn folder-settings-btn';
      gear.setAttribute('aria-label', 'Rename folder');
      gear.title = 'Rename folder';
      gear.innerHTML = settingsBtn.innerHTML;
      gear.addEventListener('click', () => openFolderCompose(folder));
      header.appendChild(gear);
    }
    return header;
  }

  function buildFolderSubTabs() {
    const tabsRow = document.createElement('div');
    tabsRow.className = 'tabs folder-tabs';

    const tasksTab = document.createElement('button');
    tasksTab.className = 'tab' + (folderDashboardView ? '' : ' active');
    tasksTab.textContent = 'Tasks';
    tasksTab.addEventListener('click', () => { folderDashboardView = false; render(); });

    const dashTab = document.createElement('button');
    dashTab.className = 'tab' + (folderDashboardView ? ' active' : '');
    dashTab.textContent = 'Dashboard';
    dashTab.addEventListener('click', () => { folderDashboardView = true; render(); });

    tabsRow.appendChild(tasksTab);
    tabsRow.appendChild(dashTab);
    return tabsRow;
  }

  function renderFolderDashboard(folderId) {
    const folderTasks = tasks.filter(t => t.list === 'today' && t.folderId === folderId);
    const done = folderTasks.filter(t => t.done).length;
    const total = folderTasks.length;
    const pct = total ? Math.round((done / total) * 100) : 0;

    const wrap = document.createElement('div');
    wrap.className = 'dashboard';
    wrap.innerHTML = `
      <div class="stat-card wide">
        <div class="stat-label">Completed</div>
        <div class="stat-value">${done}<span class="stat-of">/${total}</span></div>
        <div class="stat-sub">${pct}% of tasks in this folder completed</div>
      </div>
    `;
    listEl.appendChild(wrap);
  }

  function renderTodayView() {
    listEl.innerHTML = '';

    if (todaySelectedFolder === null) {
      listEl.appendChild(buildFoldersRow());
      const unfiled = tasks.filter(t => t.list === 'today' && !t.folderId);
      if (unfiled.length === 0) {
        emptyEl.textContent = 'No tasks yet. Hit + to add one.';
        emptyEl.style.display = 'block';
      } else {
        emptyEl.style.display = 'none';
        unfiled.forEach(t => listEl.appendChild(buildTaskRow(t)));
      }
      return;
    }

    const folder = folders.find(f => f.id === todaySelectedFolder);
    listEl.appendChild(buildFolderDetailHeader(folder));
    listEl.appendChild(buildFolderSubTabs());

    if (folderDashboardView) {
      emptyEl.style.display = 'none';
      renderFolderDashboard(todaySelectedFolder);
      return;
    }

    const folderTasks = tasks.filter(t => t.list === 'today' && t.folderId === todaySelectedFolder);
    if (folderTasks.length === 0) {
      emptyEl.textContent = 'No tasks in this folder yet.';
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      folderTasks.forEach(t => listEl.appendChild(buildTaskRow(t)));
    }
  }

  function render() {
    addbarEl.style.display = (currentView === 'today' && !(todaySelectedFolder !== null && folderDashboardView) || (currentView === 'weekly' && weeklySelectedDay !== null)) ? 'flex' : 'none';
    if (currentView === 'today') {
      renderTodayView();
    } else if (currentView === 'weekly') {
      if (weeklySelectedDay === null) {
        renderWeekCards();
      } else {
        renderDayDetail(weeklySelectedDay);
      }
    } else {
      renderDashboard();
    }
  }

  function setActiveTab(viewName) {
    tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === viewName));
  }

  tabsEl.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentView = tab.dataset.view;
      weeklySelectedDay = null;
      todaySelectedFolder = null;
      folderDashboardView = false;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
      render();
    });
  });
  function renderDashboard() {
    listEl.innerHTML = '';
    emptyEl.style.display = 'none';

    const weekDays = getCurrentWeekDays();
    const weekStart = weekDays[0];
    const weekEnd = weekDays[6] + 86400000;

    const todayList = tasks.filter(t => t.list === 'today');
    const weeklyList = tasks.filter(t => t.list === 'weekly' && t.createdAt >= weekStart && t.createdAt < weekEnd);
    const todayDone = todayList.filter(t => t.done).length;
    const weekDone = weeklyList.filter(t => t.done).length;
    const weekTotal = weeklyList.length;
    const weekPct = weekTotal ? Math.round((weekDone / weekTotal) * 100) : 0;
    const allDone = tasks.filter(t => t.done).length;
    const allTotal = tasks.length;
    const pct = allTotal ? Math.round((allDone / allTotal) * 100) : 0;

    const dayRows = weekDays.map((dayTs, i) => {
      const dayTasks = weeklyList.filter(t => isSameDay(t.createdAt, dayTs));
      const dayDone = dayTasks.filter(t => t.done).length;
      const dayTotal = dayTasks.length;
      const dayPct = dayTotal ? Math.round((dayDone / dayTotal) * 100) : 0;
      return `
        <div class="day-stat-row">
          <div class="day-stat-name">${WEEKDAY_NAMES[i]}</div>
          <div class="day-stat-count">${dayDone}/${dayTotal}</div>
          <div class="day-stat-pct">${dayPct}%</div>
        </div>`;
    }).join('');

    const wrap = document.createElement('div');
    wrap.className = 'dashboard';
    wrap.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Today</div>
        <div class="stat-value">${todayDone}<span class="stat-of">/${todayList.length}</span></div>
        <div class="stat-sub">tasks completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All Time</div>
        <div class="stat-value">${allDone}<span class="stat-of">/${allTotal}</span></div>
        <div class="stat-sub">${pct}% of all tasks completed</div>
      </div>
      <div class="stat-card wide">
        <div class="stat-label">Weekly</div>
        <div class="stat-value">${weekDone}<span class="stat-of">/${weekTotal}</span></div>
        <div class="stat-sub">${weekPct}% of this week's tasks completed</div>
        <div class="day-stats">${dayRows}</div>
      </div>
    `;
    listEl.appendChild(wrap);
  }

  let justDragged = false;
  let dragGhost = null;
  let dragActiveTaskId = null;
  let dragOverCard = null;
  let lastReorderKey = null;

  function moveTaskToFolder(taskId, folderId) {
    const t = tasks.find(x => x.id === taskId);
    if (!t) return;
    t.folderId = folderId;
    render();
    saveTasks();
  }

  function clearDragOverHighlight() {
    if (dragOverCard) {
      const sq = dragOverCard.classList.contains('day-detail-back')
        ? dragOverCard
        : dragOverCard.querySelector('.folder-square');
      if (sq) sq.classList.remove('drag-over');
      dragOverCard = null;
    }
  }

  function findDropTarget(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el || !el.closest) return { type: null };
    const folderCard = el.closest('.folder-card:not(.add-folder)');
    if (folderCard) return { type: 'folder', el: folderCard };
    const backBtn = el.closest('.day-detail-back');
    if (backBtn) return { type: 'unfile', el: backBtn };
    const taskBlock = el.closest('.task-block');
    if (taskBlock && taskBlock.dataset.taskId && taskBlock.dataset.taskId !== dragActiveTaskId) {
      return { type: 'task', el: taskBlock };
    }
    return { type: null };
  }

  function performLiveReorder(overBlockEl, clientY) {
    const overId = overBlockEl.dataset.taskId;
    if (!overId || overId === dragActiveTaskId) return;
    const draggedTask = tasks.find(t => t.id === dragActiveTaskId);
    const overTask = tasks.find(t => t.id === overId);
    if (!draggedTask || !overTask) return;
    const siblings = getTaskSiblings(draggedTask);
    if (!siblings.some(t => t.id === overId)) return;

    const rect = overBlockEl.getBoundingClientRect();
    const before = clientY < rect.top + rect.height / 2;
    const key = overId + (before ? 'b' : 'a');
    if (key === lastReorderKey) return;
    lastReorderKey = key;

    const idxDragged = tasks.indexOf(draggedTask);
    tasks.splice(idxDragged, 1);
    const idxOver = tasks.indexOf(overTask);
    tasks.splice(before ? idxOver : idxOver + 1, 0, draggedTask);
    render();
  }

  function onDragPointerMove(e) {
    if (!dragActiveTaskId) return;
    e.preventDefault();
    if (dragGhost) {
      dragGhost.style.left = e.clientX + 'px';
      dragGhost.style.top = e.clientY + 'px';
    }
    const target = findDropTarget(e.clientX, e.clientY);
    if (target.type === 'folder' || target.type === 'unfile') {
      lastReorderKey = null;
      if (target.el !== dragOverCard) {
        clearDragOverHighlight();
        const sq = target.type === 'unfile' ? target.el : target.el.querySelector('.folder-square');
        if (sq) sq.classList.add('drag-over');
        dragOverCard = target.el;
      }
    } else {
      clearDragOverHighlight();
      if (target.type === 'task') {
        performLiveReorder(target.el, e.clientY);
      } else {
        lastReorderKey = null;
      }
    }
  }

  function onDragPointerUp(e) {
    document.removeEventListener('pointermove', onDragPointerMove);
    document.removeEventListener('pointerup', onDragPointerUp);
    document.removeEventListener('pointercancel', onDragPointerUp);

    const draggedId = dragActiveTaskId;
    const draggedTask = tasks.find(t => t.id === draggedId);
    const target = findDropTarget(e.clientX, e.clientY);
    clearDragOverHighlight();
    if (dragGhost) {
      dragGhost.remove();
      dragGhost = null;
    }
    dragActiveTaskId = null;
    lastReorderKey = null;

    if (draggedTask && draggedTask.list === 'today' && target.type === 'unfile') {
      moveTaskToFolder(draggedId, null);
    } else if (draggedTask && draggedTask.list === 'today' && target.type === 'folder') {
      moveTaskToFolder(draggedId, target.el.dataset.folderId);
    } else {
      saveTasks();
      render();
    }
    justDragged = true;
  }

  function beginDrag(task, x, y) {
    dragActiveTaskId = task.id;
    lastReorderKey = null;
    dragGhost = document.createElement('div');
    dragGhost.className = 'drag-ghost';
    dragGhost.textContent = task.title;
    dragGhost.style.left = x + 'px';
    dragGhost.style.top = y + 'px';
    document.body.appendChild(dragGhost);

    document.addEventListener('pointermove', onDragPointerMove, { passive: false });
    document.addEventListener('pointerup', onDragPointerUp);
    document.addEventListener('pointercancel', onDragPointerUp);

    if (navigator.vibrate) navigator.vibrate(15);
    render();
  }

  function attachDragHandlers(contentEl, task) {
    let timer = null;
    let startX = 0, startY = 0;
    let armed = false;
    let moved = false;
    let manualScrolling = false;
    let lastY = 0;

    contentEl.addEventListener('pointerdown', (e) => {
      startX = e.clientX;
      startY = e.clientY;
      lastY = e.clientY;
      moved = false;
      armed = false;
      manualScrolling = false;
      timer = setTimeout(() => {
        if (!moved) {
          armed = true;
          beginDrag(task, startX, startY);
        }
      }, 350);
    });

    contentEl.addEventListener('pointermove', (e) => {
      const dx = Math.abs(e.clientX - startX);
      const dy = Math.abs(e.clientY - startY);
      if (!armed && !moved && (dx > 12 || dy > 12)) {
        moved = true;
        if (timer) { clearTimeout(timer); timer = null; }
        if (dy > dx) {
          manualScrolling = true;
        }
      }
      if (manualScrolling) {
        listEl.scrollTop += (lastY - e.clientY);
      }
      lastY = e.clientY;
    }, { passive: true });

    contentEl.addEventListener('pointerup', () => {
      if (timer) { clearTimeout(timer); timer = null; }
      manualScrolling = false;
    });

    contentEl.addEventListener('pointercancel', () => {
      if (timer) { clearTimeout(timer); timer = null; }
      manualScrolling = false;
    });
  }

  function getTaskSiblings(task) {
    if (task.list === 'weekly') {
      return tasks.filter(t => t.list === 'weekly' && isSameDay(t.createdAt, task.createdAt));
    }
    return tasks.filter(t => t.list === 'today' && (t.folderId || null) === (task.folderId || null));
  }

  function toggleTask(id) {
    const t = tasks.find(x => x.id === id);
    if (t) t.done = !t.done;
    render();
    saveTasks();
  }

  function toggleSubtask(taskId, subId) {
    const t = tasks.find(x => x.id === taskId);
    if (!t || !t.subtasks) return;
    const s = t.subtasks.find(x => x.id === subId);
    if (s) s.done = !s.done;
    render();
    saveTasks();
  }

  function deleteTask(id) {
    tasks = tasks.filter(x => x.id !== id);
    render();
    saveTasks();
  }

  function addTask(title, description, subtasks) {
    const trimmedTitle = title.trim();
    if (!trimmedTitle) return;
    tasks.unshift({
      id: uid(),
      title: trimmedTitle,
      description: description.trim(),
      done: false,
      subtasks: subtasks && subtasks.length ? subtasks : [],
      list: addContext.list,
      createdAt: addContext.createdAt || Date.now(),
      folderId: addContext.folderId || null
    });
    render();
    saveTasks();
  }

  function editTask(id, title, description, subtasks) {
    const trimmedTitle = title.trim();
    if (!trimmedTitle) return;
    const t = tasks.find(x => x.id === id);
    if (t) {
      t.title = trimmedTitle;
      t.description = description.trim();
      t.subtasks = subtasks && subtasks.length ? subtasks : [];
    }
    render();
    saveTasks();
  }

  function renderStepsList() {
    stepsList.innerHTML = '';
    composeSteps.forEach((step, i) => {
      const row = document.createElement('div');
      row.className = 'step-row';

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Step ' + (i + 1);
      input.maxLength = 140;
      input.value = step.title;
      input.addEventListener('input', () => { composeSteps[i].title = input.value; });

      const remove = document.createElement('span');
      remove.className = 'step-remove';
      remove.textContent = '✕';
      remove.addEventListener('click', () => {
        composeSteps.splice(i, 1);
        renderStepsList();
      });

      row.appendChild(input);
      row.appendChild(remove);
      stepsList.appendChild(row);
    });
  }

  stepsToggle.addEventListener('change', () => {
    stepsEditor.classList.toggle('open', stepsToggle.checked);
    if (stepsToggle.checked && composeSteps.length === 0) {
      composeSteps.push({ id: uid(), title: '', done: false });
      renderStepsList();
    }
  });

  addStepBtn.addEventListener('click', () => {
    composeSteps.push({ id: uid(), title: '', done: false });
    renderStepsList();
  });

  function openCompose(mode, task) {
    if (mode === 'edit' && task) {
      editingId = task.id;
      composeHeading.textContent = 'Edit Task';
      composeTitle.value = task.title;
      composeDesc.value = task.description || '';
      composeSteps = (task.subtasks || []).map(s => ({ ...s }));
      stepsToggle.checked = composeSteps.length > 0;
      stepsEditor.classList.toggle('open', composeSteps.length > 0);
    } else {
      editingId = null;
      composeHeading.textContent = 'New Task';
      composeTitle.value = '';
      composeDesc.value = '';
      composeSteps = [];
      stepsToggle.checked = false;
      stepsEditor.classList.remove('open');
    }
    renderStepsList();
    backdrop.classList.add('open');
    compose.classList.add('open');
    setTimeout(() => composeTitle.focus(), 250);
  }

  function closeCompose() {
    backdrop.classList.remove('open');
    compose.classList.remove('open');
    editingId = null;
  }

  function saveCompose() {
    const titleVal = composeTitle.value;
    const descVal = composeDesc.value;
    if (!titleVal.trim()) return;
    const finalSteps = stepsToggle.checked
      ? composeSteps.filter(s => s.title.trim()).map(s => ({ id: s.id || uid(), title: s.title.trim(), done: !!s.done }))
      : [];
    if (editingId) {
      editTask(editingId, titleVal, descVal, finalSteps);
    } else {
      addTask(titleVal, descVal, finalSteps);
    }
    closeCompose();
  }

  splash.addEventListener('click', () => {
    splash.classList.add('leaving');
    setTimeout(() => { splash.style.display = 'none'; }, 600);
  });

  function stepBackOneLevel() {
    if (currentView === 'dashboard') {
      currentView = 'weekly';
      weeklySelectedDay = null;
      setActiveTab('weekly');
      render();
      return true;
    }
    if (currentView === 'weekly') {
      if (weeklySelectedDay !== null) {
        weeklySelectedDay = null;
        render();
        return true;
      }
      currentView = 'today';
      todaySelectedFolder = null;
      folderDashboardView = false;
      setActiveTab('today');
      render();
      return true;
    }
    if (currentView === 'today') {
      if (todaySelectedFolder !== null) {
        todaySelectedFolder = null;
        folderDashboardView = false;
        render();
        return true;
      }
      splash.style.display = 'flex';
      buildWordmark(THEMES[prefs.theme] || THEMES.vhs);
      resetVhsCounter();
      requestAnimationFrame(() => splash.classList.remove('leaving'));
      return true;
    }
    return false;
  }

  backBtn.addEventListener('click', stepBackOneLevel);

  function isSplashVisible() {
    return splash.style.display !== 'none' && !splash.classList.contains('leaving');
  }

  function handleHardwareBack() {
    if (backdrop.classList.contains('open')) { closeCompose(); return true; }
    if (settingsBackdrop.classList.contains('open')) { closeSettings(); return true; }
    if (folderBackdrop.classList.contains('open')) { closeFolderCompose(); return true; }
    if (isSplashVisible()) { return false; }
    return stepBackOneLevel();
  }

  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => {
    const handled = handleHardwareBack();
    if (handled) {
      history.pushState(null, '', location.href);
    }
  });

  fab.addEventListener('click', () => {
    if (currentView === 'weekly' && weeklySelectedDay !== null) {
      addContext = { list: 'weekly', createdAt: weeklySelectedDay, folderId: null };
    } else if (currentView === 'today' && todaySelectedFolder !== null) {
      addContext = { list: 'today', createdAt: Date.now(), folderId: todaySelectedFolder };
    } else {
      addContext = { list: 'today', createdAt: Date.now(), folderId: null };
    }
    openCompose('add');
  });
  backdrop.addEventListener('click', closeCompose);
  composeCancel.addEventListener('click', closeCompose);
  composeSave.addEventListener('click', saveCompose);

  composeTitle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      composeDesc.focus();
    }
  });

  async function loadPrefs() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        prefs = JSON.parse(raw);
      }
    } catch (e) {
      // no saved prefs yet, keep defaults
    }
    if (prefs.theme === 'nouveau') prefs.theme = 'ipod';
    applyTheme(prefs.theme || 'vhs');
  }

  async function savePrefs() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(prefs));
    } catch (e) {
      console.error('Could not save settings', e);
    }
  }

  let svgIdCounter = 0;

  function renderChevronDecor(cfg, container) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.position = 'absolute';
    svg.style.inset = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';

    const t = cfg.thickness;
    const apexX = cfg.apexX;
    const coloredCount = cfg.colored;
    const blackCount = cfg.black;

    for (let i = 0; i < coloredCount; i++) {
      const topLeftY = cfg.leftBaseY + i * t;
      const topApexY = cfg.apexBaseY + i * t;
      const topRightY = cfg.rightBaseY + i * t;
      const botLeftY = cfg.leftBaseY + (i + 1) * t;
      const botApexY = cfg.apexBaseY + (i + 1) * t;
      const botRightY = cfg.rightBaseY + (i + 1) * t;
      const poly = document.createElementNS(svgNS, 'polygon');
      poly.setAttribute('points', `0,${topLeftY} ${apexX},${topApexY} 100,${topRightY} 100,${botRightY} ${apexX},${botApexY} 0,${botLeftY}`);
      poly.setAttribute('fill', cfg.colors[i]);
      svg.appendChild(poly);
    }

    const chordLeftY = cfg.leftBaseY + coloredCount * t;
    const chordRightY = cfg.rightBaseY + coloredCount * t;
    for (let j = 0; j < blackCount; j++) {
      const topLeftY = chordLeftY + j * t;
      const topRightY = chordRightY + j * t;
      const botLeftY = chordLeftY + (j + 1) * t;
      const botRightY = chordRightY + (j + 1) * t;
      const poly = document.createElementNS(svgNS, 'polygon');
      poly.setAttribute('points', `0,${topLeftY} 100,${topRightY} 100,${botRightY} 0,${botLeftY}`);
      poly.setAttribute('fill', cfg.colors[coloredCount + j]);
      svg.appendChild(poly);
    }

    container.appendChild(svg);
  }

  function renderSwooshRibbon(cfg, container) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 200');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    svg.style.position = 'absolute';
    svg.style.inset = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';

    const defs = document.createElementNS(svgNS, 'defs');
    const grad = document.createElementNS(svgNS, 'linearGradient');
    const gradId = 'swooshGrad-' + (svgIdCounter++);
    grad.setAttribute('id', gradId);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', cfg.start[0]);
    grad.setAttribute('y1', cfg.start[1]);
    grad.setAttribute('x2', cfg.end[0]);
    grad.setAttribute('y2', cfg.end[1]);
    cfg.colors.forEach((color, i) => {
      const stop = document.createElementNS(svgNS, 'stop');
      stop.setAttribute('offset', (i / (cfg.colors.length - 1)) * 100 + '%');
      stop.setAttribute('stop-color', color);
      grad.appendChild(stop);
    });
    defs.appendChild(grad);
    svg.appendChild(defs);

    const path = document.createElementNS(svgNS, 'path');
    const [x0, y0] = cfg.start;
    const [cx1, cy1] = cfg.control1;
    const [cx2, cy2] = cfg.control2;
    const [x1, y1] = cfg.end;
    path.setAttribute('d', `M ${x0} ${y0} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x1} ${y1}`);
    path.setAttribute('stroke', `url(#${gradId})`);
    path.setAttribute('stroke-width', cfg.width || 26);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);

    container.appendChild(svg);
  }

  function renderIndentedRibbon(cfg, container) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.position = 'absolute';
    svg.style.inset = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';

    const t = cfg.thickness;
    const kinkY = cfg.kinkY;

    for (let i = 0; i < cfg.colors.length; i++) {
      const topX0 = cfg.topX + i * t;
      const kinkX0 = cfg.kinkX + i * t;
      const botX0 = cfg.bottomX + i * t;
      const topX1 = cfg.topX + (i + 1) * t;
      const kinkX1 = cfg.kinkX + (i + 1) * t;
      const botX1 = cfg.bottomX + (i + 1) * t;
      const poly = document.createElementNS(svgNS, 'polygon');
      poly.setAttribute('points', `${topX0},0 ${kinkX0},${kinkY} ${botX0},100 ${botX1},100 ${kinkX1},${kinkY} ${topX1},0`);
      poly.setAttribute('fill', cfg.colors[i]);
      svg.appendChild(poly);
    }

    if (cfg.tailColors) {
      const base = cfg.colors.length;
      let i = 0;
      while (i < cfg.tailColors.length) {
        let j = i;
        while (j + 1 < cfg.tailColors.length && cfg.tailColors[j + 1] === cfg.tailColors[i]) j++;
        const nStart = base + i;
        const nEnd = base + j + 1;
        const kinkX0 = cfg.kinkX + nStart * t;
        const botX0 = cfg.bottomX + nStart * t;
        const kinkX1 = cfg.kinkX + nEnd * t;
        const botX1 = cfg.bottomX + nEnd * t;
        const poly = document.createElementNS(svgNS, 'polygon');
        poly.setAttribute('points', `${kinkX0},${kinkY} ${botX0},100 ${botX1},100 ${kinkX1},${kinkY}`);
        poly.setAttribute('fill', cfg.tailColors[i]);
        svg.appendChild(poly);
        i = j + 1;
      }
    }

    container.appendChild(svg);
  }

  function renderWaves(cfg, container) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    svg.style.position = 'absolute';
    svg.style.inset = '0';
    svg.style.width = '100%';
    svg.style.height = '100%';

    // One wavelength in viewBox units. The path runs past both edges so it can
    // drift by exactly one wavelength and loop without a visible seam.
    const period = 100 / cfg.cycles;
    const x0 = -period - 10, x1 = 100 + period + 10;
    const waveD = (base, phase) => {
      let d = '';
      for (let x = x0; x <= x1 + 0.01; x += 1.5) {
        const y = base + cfg.amplitude * Math.sin((x / 100) * cfg.cycles * Math.PI * 2 + phase);
        d += (x === x0 ? 'M ' : ' L ') + x.toFixed(2) + ' ' + y.toFixed(2);
      }
      return d + ` L ${x1} 110 L ${x0} 110 Z`;
    };
    const addLayer = (d, color, i) => {
      const g = document.createElementNS(svgNS, 'g');
      g.setAttribute('class', 'wv-layer');
      g.style.setProperty('--i', i);
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('fill', color);
      path.setAttribute('class', 'wv-drift' + (i % 2 ? ' wv-rev' : ''));
      path.style.setProperty('--period', period + 'px');
      path.style.setProperty('--dur', (16 + i * 3) + 's');
      g.appendChild(path);
      svg.appendChild(g);
    };

    cfg.colors.forEach((color, i) => {
      addLayer(waveD(cfg.start + i * cfg.gap, i * (cfg.phaseStep || 0)), color, i);
    });

    if (cfg.bar) {
      const phase = cfg.colors.length * (cfg.phaseStep || 0);
      addLayer(waveD(100 - cfg.bar.height, phase), cfg.bar.color, cfg.colors.length);
    }

    container.appendChild(svg);
  }

  function renderMemphis(c, container) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const isMini = container.classList.contains('mini-decor');
    const uidm = 'mf' + (svgIdCounter++);
    const mk = (tag, attrs, parent) => {
      const e = document.createElementNS(svgNS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(e);
      return e;
    };
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', isMini ? '0 18 100 100' : '0 0 100 180');
    svg.setAttribute('preserveAspectRatio', isMini ? 'xMidYMid slice' : 'xMidYMax slice');
    svg.setAttribute('aria-hidden', 'true');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;overflow:visible';

    const defs = mk('defs', {});
    const dots = mk('pattern', { id: uidm + 'd', width: 3.2, height: 3.2, patternUnits: 'userSpaceOnUse' }, defs);
    mk('circle', { cx: 1.6, cy: 1.6, r: 0.62, fill: c.ink }, dots);
    const stripes = mk('pattern', { id: uidm + 's', width: 4, height: 4, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    mk('rect', { width: 4, height: 4, fill: c.pink }, stripes);
    mk('rect', { width: 2, height: 4, fill: c.yellow }, stripes);

    const SH = 1.6; // hard "3D" shadow offset
    const group = (cls) => mk('g', cls ? { class: cls } : {});
    // Draw a shape twice: a solid ink copy nudged down-right, then the colored one with an ink outline.
    const pop = (tag, attrs, fill, g) => {
      const parent = g || svg;
      const shG = mk('g', { transform: `translate(${SH} ${SH})` }, parent);
      mk(tag, Object.assign({ fill: c.ink, stroke: c.ink, 'stroke-width': 0.7, 'stroke-linejoin': 'round' }, attrs), shG);
      return mk(tag, Object.assign({ fill, stroke: c.ink, 'stroke-width': 0.7, 'stroke-linejoin': 'round' }, attrs), parent);
    };
    const line = (d, color, w, g) => {
      const parent = g || svg;
      mk('path', { d, fill: 'none', stroke: c.ink, 'stroke-width': w + 1.3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: `translate(${SH} ${SH})` }, parent);
      mk('path', { d, fill: 'none', stroke: c.ink, 'stroke-width': w + 1.3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
      mk('path', { d, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
    };

    // Big sun bleeding off the left edge
    pop('circle', { cx: 4, cy: 30, r: 20 }, c.yellow, group('mf-drift'));
    // Dot grid block
    mk('rect', { x: 51.2, y: 28.8, width: 32, height: 19.2, fill: `url(#${uidm}d)` });
    // Tilted triangle
    pop('polygon', { points: '60,62 86,50 82,78' }, c.pink, group('mf-wobble'));
    // Cyan zigzag
    line('M 10 70 L 17 62 L 24 70 L 31 62 L 38 70 L 45 62', c.cyan, 2.6, group('mf-bob'));
    // Striped half-disc on the left edge
    pop('path', { d: 'M 0 88 A 15 15 0 0 1 0 118 Z' }, `url(#${uidm}s)`);
    // Purple squiggle
    line('M 44 96 q 5 -7 10 0 t 10 0 t 10 0 t 10 0', c.purple, 2.4, group('mf-bob mf-late'));
    // Pink ring
    const ringG = group('mf-drift mf-late');
    mk('circle', { cx: 86 + SH, cy: 22 + SH, r: 5.5, fill: 'none', stroke: c.ink, 'stroke-width': 3.6 }, ringG);
    mk('circle', { cx: 86, cy: 22, r: 5.5, fill: 'none', stroke: c.ink, 'stroke-width': 3.6 }, ringG);
    mk('circle', { cx: 86, cy: 22, r: 5.5, fill: 'none', stroke: c.pink, 'stroke-width': 2.2 }, ringG);
    // Lightning bolt beside the title
    pop('polygon', { points: '88,112 79,130 86,130 81,146 95,124 88,124 93,112' }, c.yellow, group('mf-wobble mf-late'));
    // Confetti
    pop('rect', { x: 26, y: 40, width: 7, height: 3.2, transform: 'rotate(-30 29.5 41.6)' }, c.lime);
    pop('circle', { cx: 40, cy: 19, r: 2.4 }, c.cyan);
    pop('circle', { cx: 26, cy: 108, r: 2 }, c.orange);
    pop('rect', { x: 58, y: 104, width: 3.2, height: 7, transform: 'rotate(25 59.6 107.5)' }, c.cyan);
    mk('path', { d: 'M 38 84 h 5 M 40.5 81.5 v 5', stroke: c.ink, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
    mk('path', { d: 'M 93 72 h 5 M 95.5 69.5 v 5', stroke: c.ink, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
    pop('polygon', { points: '14,46 19,50 13,53' }, c.purple);
    // Checkerboard floor strip
    const cg = mk('g', {});
    for (let i = 0; i < 26; i++) {
      mk('rect', { x: i * 4, y: 175, width: 4, height: 2.6, fill: i % 2 ? c.ink : '#fff' }, cg);
      mk('rect', { x: i * 4, y: 177.6, width: 4, height: 2.6, fill: i % 2 ? '#fff' : c.ink }, cg);
    }
    // Quarter-circle in the bottom-right corner
    pop('path', { d: 'M 100 150 A 24 24 0 0 0 76 174 L 100 174 Z' }, c.cyan);
    mk('rect', { x: 0, y: 174, width: 100, height: 1, fill: c.ink });

    if (isMini) svg.querySelectorAll('[class^="mf-"]').forEach(g => g.removeAttribute('class'));
    container.appendChild(svg);
  }

  function renderVhsTape(c, container) {
    const isMini = container.classList.contains('mini-decor');
    const svgNS = 'http://www.w3.org/2000/svg';
    const root = document.createElement('div');
    root.className = 'vhs-case' + (isMini ? ' is-mini' : '');
    root.style.setProperty('--vhs-body', c.body);
    root.style.setProperty('--vhs-label', c.label);
    root.style.setProperty('--vhs-paper', c.paper);

    // Paper label (runs the full height, like a tape turned on its side)
    const label = document.createElement('div');
    label.className = 'vhs-label';
    const band = document.createElement('div');
    band.className = 'vhs-band';
    c.stripes.forEach(col => {
      const st = document.createElement('i');
      st.style.background = col;
      band.appendChild(st);
    });
    label.appendChild(band);
    if (!isMini) {
      const fine = document.createElement('div');
      fine.className = 'vhs-fine';
      fine.innerHTML = '<span>Video cassette</span><span>High grade</span><span>180 min</span>';
      label.appendChild(fine);
    }
    root.appendChild(label);

    // Window with the two reels
    const win = document.createElement('div');
    win.className = 'vhs-window';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 40 100');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    const mk = (tag, attrs, parent) => {
      const e = document.createElementNS(svgNS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      parent.appendChild(e);
      return e;
    };
    const reel = (cy, wound, cls) => {
      mk('circle', { cx: 20, cy, r: wound, fill: '#2a1a14' }, svg);
      mk('circle', { cx: 20, cy, r: wound, fill: 'none', stroke: '#4a3024', 'stroke-width': 0.35, 'stroke-dasharray': '0.4 0.9' }, svg);
      const hub = mk('g', { class: cls }, svg);
      mk('circle', { cx: 20, cy, r: 7.2, fill: '#ece6da' }, hub);
      mk('circle', { cx: 20, cy, r: 3.2, fill: '#171313' }, hub);
      for (let k = 0; k < 6; k++) {
        const a = k * 60;
        mk('rect', { x: 19.3, y: cy - 7.4, width: 1.4, height: 3.2, fill: '#171313', transform: `rotate(${a} 20 ${cy})` }, hub);
      }
    };
    reel(27, 17, 'vhs-hub');
    reel(73, 10, 'vhs-hub vhs-hub-b');
    // Glare across the window
    mk('polygon', { points: '0,0 14,0 0,30', fill: 'rgba(255,255,255,0.07)' }, svg);
    win.appendChild(svg);
    root.appendChild(win);

    if (!isMini) {
      const ribs = document.createElement('div');
      ribs.className = 'vhs-ribs';
      root.appendChild(ribs);
      ['tl', 'tr', 'bl', 'br'].forEach(pos => {
        const sc = document.createElement('i');
        sc.className = 'vhs-screw ' + pos;
        root.appendChild(sc);
      });
    }
    container.appendChild(root);
  }

  function renderDeco(c, container) {
    const svgNS = 'http://www.w3.org/2000/svg';
    const isMini = container.classList.contains('mini-decor');
    const mk = (tag, attrs, parent) => {
      const e = document.createElementNS(svgNS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(e);
      return e;
    };
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', isMini ? '0 100 100 80' : '0 0 100 180');
    svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');
    svg.setAttribute('aria-hidden', 'true');
    svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';

    const cx = 50, cy = 166;
    const half = (r) => `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy} Z`;

    // Outline arcs around the sun
    [68, 65].forEach((r, i) => mk('path', { d: `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`, fill: 'none', stroke: c.ink, 'stroke-width': i ? 0.3 : 0.6, class: 'deco-line' }));

    // Rising sun: concentric half-discs, outer to inner
    const step = 7.5;
    const outer = 61;
    c.rings.forEach((col, i) => {
      mk('path', { d: half(outer - i * step), fill: col, class: 'deco-ring', style: `--d:${(c.rings.length - i) * 90}ms` });
    });
    mk('path', { d: half(outer - c.rings.length * step), fill: c.base, class: 'deco-ring', style: '--d:0ms' });

    // Radiating rays cut through the rings
    const rays = mk('g', { class: 'deco-rays' });
    const n = 15;
    for (let k = 1; k < n; k++) {
      const a = Math.PI + (k / n) * Math.PI;
      const w = 0.028;
      const r0 = outer - c.rings.length * step + 1.5, r1 = outer + 0.1;
      const p = (ang, r) => `${(cx + r * Math.cos(ang)).toFixed(2)},${(cy + r * Math.sin(ang)).toFixed(2)}`;
      mk('polygon', { points: `${p(a - w * 0.25, r0)} ${p(a - w, r1)} ${p(a + w, r1)} ${p(a + w * 0.25, r0)}`, fill: c.paper }, rays);
    }

    // Stepped (ziggurat) base the sun rises from
    mk('path', { d: 'M 0 180 L 0 166 L 18 166 L 18 162 L 30 162 L 30 158 L 70 158 L 70 162 L 82 162 L 82 166 L 100 166 L 100 180 Z', fill: c.base });
    mk('path', { d: 'M 0 169 L 100 169', stroke: c.trim || '#ffb703', 'stroke-width': 0.4 });
    mk('path', { d: 'M 0 170.2 L 100 170.2', stroke: c.trim || '#ffb703', 'stroke-width': 0.2 });

    if (!isMini) {
      const frame = document.createElement('div');
      frame.className = 'deco-frame';
      frame.innerHTML = '<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>';
      container.appendChild(frame);
    }
    container.appendChild(svg);
  }

  function renderFilmBox(c, container) {
    const isMini = container.classList.contains('mini-decor');
    const add = (cls, html) => {
      const d = document.createElement('div');
      d.className = cls;
      if (html) d.innerHTML = html;
      container.appendChild(d);
      return d;
    };
    add('kf-panel-edge');
    add('kf-panel');

    // 35mm strip: 80 units tall, frames 76 wide on an 82 pitch, 8 perforations per frame
    const pitch = 82, count = 14, W = pitch * count;
    let perfs = '', frames = '', print = '';
    for (let x = 1.5; x < W; x += pitch / 8) {
      perfs += `<rect x="${x.toFixed(2)}" y="2.5" width="5.4" height="4.6" rx="1.1"/><rect x="${x.toFixed(2)}" y="72.9" width="5.4" height="4.6" rx="1.1"/>`;
    }
    for (let i = 0; i < count; i++) {
      const x = i * pitch + 3;
      const col = c.frames[i % c.frames.length];
      frames += `<rect x="${x}" y="14" width="76" height="52" rx="3" fill="${col}"/>`;
      const n = i + 8;
      print += `<text x="${x + 4}" y="12.2">&#9656; ${n}</text><text x="${x + 44}" y="12.2">${n}A</text>`;
    }
    // one exposed frame: a low sun over a horizon
    const fx = 6 * pitch + 3;
    frames += `<circle cx="${fx + 38}" cy="46" r="13" fill="${c.gold}"/><rect x="${fx}" y="46" width="76" height="20" fill="${c.base}" opacity="0.55"/>`;

    const strip = add('kf-strip');
    strip.innerHTML = `<svg viewBox="0 0 ${W} 80" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
      <g class="kf-reel">
        <rect x="-200" width="${W + 400}" height="80" fill="${c.base}"/>
        <g fill="${c.gold}">${perfs}</g>
        <g>${frames}</g>
        <g fill="${c.gold}" opacity="0.75" font-family="Archivo, sans-serif" font-weight="700" font-size="4">${print}</g>
      </g>
    </svg>`;

    if (isMini) return;

    add('kf-speed', '<b>100</b><span>ISO 100/21&deg;</span>');
    add('kf-exp', '<b>24</b><span>exp.</span>');
    const d = new Date();
    const month = d.toLocaleString('en', { month: 'short' });
    add('kf-flap', `<span>Process C-41</span><span>Develop before ${month} ${d.getFullYear() + 1}</span>`);
  }

  function renderIpod(c, container) {

  // Elapsed time on the player's screen
  let ipodStart = Date.now();

    if (!splash.classList.contains('theme-ipod') || splash.style.display === 'none') return;
    const el = splashDecor.querySelector('.ipd-elapsed');

  function renderThemeDecorInto(theme, container) {
    container.innerHTML = '';
    if (theme.ipod) {
      renderIpod(theme.ipod, container);
    } else if (theme.film) {
      renderFilmBox(theme.film, container);
    } else if (theme.deco) {
      renderDeco(theme.deco, container);
    } else if (theme.vhsTape) {
      renderVhsTape(theme.vhsTape, container);
    } else if (theme.memphis) {
      renderMemphis(theme.memphis, container);
    } else if (theme.waves) {
      renderWaves(theme.waves, container);
    } else if (theme.swoosh) {
      renderSwooshRibbon(theme.swoosh, container);
    } else if (theme.ribbon) {
      renderIndentedRibbon(theme.ribbon, container);
    } else if (theme.chevron) {
      renderChevronDecor(theme.chevron, container);

  const vhsCounter = document.getElementById('vhsCounter');

  function applyTheme(themeId) {
    const theme = THEMES[themeId] || THEMES.vhs;
    prefs.theme = themeId;
    const root = document.documentElement.style;
    root.setProperty('--black', theme.vars.black);
    root.setProperty('--panel', theme.vars.panel);
    root.setProperty('--panel-hi', theme.vars.panelHi);
    root.setProperty('--cream', theme.vars.cream);
    root.setProperty('--magenta', theme.vars.magenta);
    root.setProperty('--orange', theme.vars.orange);
    root.setProperty('--muted', theme.vars.muted);
    root.setProperty('--line', theme.vars.line);
    root.setProperty('--wordmark-color', theme.wordmarkColor || theme.vars.cream);
    root.setProperty('--wordmark-rotate', theme.wordmarkRotate || '0deg');
    root.setProperty('--sub-rotate', theme.subRotate !== undefined ? theme.subRotate : (theme.wordmarkRotate || '0deg'));
    root.setProperty('--title-offset-x', theme.wordmarkOffsetX || '0px');
    root.setProperty('--sub-offset-x', theme.subOffsetX || '0px');
    root.setProperty('--content-offset-y', theme.contentOffsetY || '0px');
    splash.classList.toggle('content-top', theme.contentPosition === 'top');

    splash.classList.toggle('theme-memphis', !!theme.memphis);
    splash.classList.toggle('theme-vhs-tape', !!theme.vhsTape);
    splash.classList.toggle('theme-deco', !!theme.deco);
    ['ink', 'paper', 'gem', 'gem2', 'shadow', 'play'].forEach(k => {
      if (theme.decoCss) root.setProperty('--deco-' + k, theme.decoCss[k]);
      else root.removeProperty('--deco-' + k);
    });
    splash.classList.toggle('theme-film', !!theme.film);
    splash.classList.toggle('theme-waves', !!theme.waves);
    splash.classList.toggle('theme-ipod', !!theme.ipod);
    ipodStart = Date.now();
    resetVhsCounter();
    buildWordmark(theme);
    submarkText.textContent = theme.submark;
    taglineText.textContent = theme.tagline;

    dotsRow.innerHTML = '';
    if (theme.vStripes) {
      theme.vStripes.forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.background = color;
        dotsRow.appendChild(dot);
      });
    }

    if (theme.taglineBottom) {
      taglineText.classList.add('bottom-pinned');
      splash.appendChild(taglineText);
    } else {
      taglineText.classList.remove('bottom-pinned');
      splashContentEl.appendChild(taglineText);
    }

    renderSplashDecor(theme);

    styleOptions.querySelectorAll('.style-card[data-theme]').forEach(card => {
      card.classList.toggle('active', card.dataset.theme === themeId);
    });
  }

  function openSettings() {
    settingsBackdrop.classList.add('open');
    settingsPanel.classList.add('open');
  }

  function closeSettings() {
    settingsBackdrop.classList.remove('open');
    settingsPanel.classList.remove('open');
  }

  settingsBtn.addEventListener('click', openSettings);
  settingsBackdrop.addEventListener('click', closeSettings);
  settingsClose.addEventListener('click', closeSettings);

  let folderRenameId = null;
  const folderComposeHeading = document.getElementById('folderComposeHeading');

  function openFolderCompose(folderToRename) {
    folderRenameId = folderToRename ? folderToRename.id : null;
    folderComposeHeading.textContent = folderRenameId ? 'Rename Folder' : 'New Folder';
    folderSave.textContent = folderRenameId ? 'Rename' : 'Save';
    folderNameInput.value = folderRenameId ? folderToRename.name : '';
    folderDeleteBtn.hidden = !folderRenameId;
    showFolderDeleteView(false);
    folderBackdrop.classList.add('open');
    folderCompose.classList.add('open');
    setTimeout(() => { folderNameInput.focus(); folderNameInput.select(); }, 250);
  }

  function closeFolderCompose() {
    folderBackdrop.classList.remove('open');
    folderCompose.classList.remove('open');
  }

  const folderEditView = document.getElementById('folderEditView');
  const folderDeleteView = document.getElementById('folderDeleteView');
  const folderDeleteBtn = document.getElementById('folderDeleteBtn');
  const folderDeleteText = document.getElementById('folderDeleteText');
  const folderDeleteCancel = document.getElementById('folderDeleteCancel');
  const folderDeleteConfirm = document.getElementById('folderDeleteConfirm');

  function showFolderDeleteView(show) {
    folderEditView.hidden = show;
    folderDeleteView.hidden = !show;
  }

  folderDeleteBtn.addEventListener('click', () => {
    const folder = folders.find(f => f.id === folderRenameId);
    if (!folder) return;
    const count = tasks.filter(t => t.folderId === folder.id).length;
    const what = count === 0 ? 'The folder is empty.'
      : count === 1 ? 'Its 1 task will be deleted with it.'
      : `All ${count} tasks inside it will be deleted with it.`;
    folderDeleteText.textContent = `"${folder.name}" will be deleted. ${what}`;
    showFolderDeleteView(true);
    folderDeleteCancel.focus();
  });
  folderDeleteCancel.addEventListener('click', () => {
    showFolderDeleteView(false);
    folderNameInput.focus();
  });
  folderDeleteConfirm.addEventListener('click', () => {
    if (!folderRenameId) return;
    deleteFolder(folderRenameId);
    folderRenameId = null;
    closeFolderCompose();
  });

  function saveFolderCompose() {
    if (!folderNameInput.value.trim()) return;
    if (folderRenameId) {
      renameFolder(folderRenameId, folderNameInput.value);
    } else {
      addFolder(folderNameInput.value);
    }
    folderRenameId = null;
    closeFolderCompose();
  }

  folderBackdrop.addEventListener('click', closeFolderCompose);
  folderCancel.addEventListener('click', closeFolderCompose);
  folderSave.addEventListener('click', saveFolderCompose);
  folderNameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveFolderCompose();
  });

  styleOptions.querySelectorAll('.style-card[data-theme]').forEach(card => {
    card.addEventListener('click', () => {
      applyTheme(card.dataset.theme);
      savePrefs();
      render();
    });
  });

  languageOptions.querySelectorAll('.option-chip[data-lang]').forEach(chip => {
    chip.addEventListener('click', () => {
      if (chip.classList.contains('disabled')) return;
      prefs.language = chip.dataset.lang;
      languageOptions.querySelectorAll('.option-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      savePrefs();
    });
  });

  loadPrefs();
  loadFolders().then(loadTasks);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>

</body>
</html>
